# MR pipelines lint, test, build and scan without AWS access. Pipelines on main also push the
# scanned image to ECR and offer a manual deploy to dev. AWS access is OIDC only (ADR 0016).
#
# CI/CD variables (Settings > CI/CD > Variables), all protected so only main sees them:
#   AWS_ACCOUNT_ID, AWS_REGION, AWS_ROLE_ARN (terraform output ci_role_arn), APP_HOST

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

stages: [lint, test, build, scan, push, deploy, verify]

variables:
  # Tags are for readers; the digest is what gets pulled.
  ALPINE_IMAGE: alpine:3.24.4@sha256:f59abe656b692d901e184be3445e084786602108599d2a51d229c0f5a48c71bf
  UV_IMAGE: ghcr.io/astral-sh/uv:0.13.5-python3.13-trixie-slim@sha256:331fbb158258608b9391e802305a9a2c9e42d689435c1d98706647122a122ab0
  AWS_CLI_IMAGE: public.ecr.aws/aws-cli/aws-cli:2.42.1@sha256:b0102d2269f87d8531d931c1a59e248101ace586886e6c077058d94c1c37b846
  HELM_VERSION: v4.3.2
  HELM_SHA256: d1c0278d46beab79582d7e50f5b3dc206944ba8e577cde618513fd07daa53983
  CRANE_VERSION: v0.22.1
  CRANE_SHA256: 0ab7a1d6932a213aed964ce97666c3077fe691c8606413674a8b3e0b9ec4cda0
  CLUSTER_NAME: eks-platform-dev
  IMAGE_REPO: eks-platform/api
  RELEASE: task-tracker
  NAMESPACE: tasks

default:
  interruptible: true

.install-helm: &install-helm
  - |
    url="https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz"
    if command -v curl >/dev/null; then curl -fsSLo /tmp/helm.tgz "$url"; else wget -qO /tmp/helm.tgz "$url"; fi
    echo "${HELM_SHA256}  /tmp/helm.tgz" | sha256sum -c -
    tar -xzf /tmp/helm.tgz -C /usr/local/bin --strip-components=1 linux-amd64/helm

# The CLI reads AWS_ROLE_ARN and AWS_WEB_IDENTITY_TOKEN_FILE and calls AssumeRoleWithWebIdentity itself.
.aws:
  image:
    name: $AWS_CLI_IMAGE
    entrypoint: [""]
  id_tokens:
    GITLAB_OIDC_TOKEN:
      aud: https://gitlab.com
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  before_script:
    - printf '%s' "$GITLAB_OIDC_TOKEN" > /tmp/web-identity-token
    - export AWS_WEB_IDENTITY_TOKEN_FILE=/tmp/web-identity-token
    - export AWS_DEFAULT_REGION="$AWS_REGION"
    - export AWS_ROLE_SESSION_NAME="gitlab-${CI_PROJECT_ID}-${CI_JOB_ID}"
    - export REGISTRY="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
    - aws sts get-caller-identity --query Arn --output text
    # The image has no tar or gzip. Amazon Linux 2023 locks its repositories to the image's release.
    - yum install -y -q tar gzip

ruff:
  stage: lint
  image:
    name: ghcr.io/astral-sh/ruff:0.17.2-alpine@sha256:2c3c9426adcdc61251b1fe27f72c71f7dd474c4fcceb7f673818b073c4c1c6b9
    entrypoint: [""]
  script:
    - cd apps/api
    - ruff check .
    - ruff format --check --diff .

terraform-fmt:
  stage: lint
  image:
    name: hashicorp/terraform:1.17.2@sha256:6e9c1e647c31a960dc9b59e13272f9111d90010c10b717f77ffb324767660475
    entrypoint: [""]
  script:
    - terraform fmt -check -recursive -diff infra

helm-lint:
  stage: lint
  image: $ALPINE_IMAGE
  before_script:
    - *install-helm
  script:
    # Placeholders only satisfy the required values; nothing is rendered against a cluster.
    - >
      helm lint --strict helm/task-tracker
      --set image.registry=registry.example --set image.tag=lint
      --set externalSecrets.region=us-east-1 --set ingress.host=tasks.lab.example.com

.uv:
  stage: test
  image: $UV_IMAGE
  variables:
    UV_CACHE_DIR: $CI_PROJECT_DIR/.uv-cache
    UV_PYTHON_DOWNLOADS: never
  cache:
    key:
      files: [apps/api/uv.lock]
    paths: [.uv-cache]
  before_script:
    - cd apps/api
    - uv sync --frozen

unit-tests:
  extends: .uv
  script:
    - uv run pytest --junitxml=../../junit.xml
  artifacts:
    when: always
    reports:
      junit: junit.xml

# The unit tests build their schema from the models, so only this job catches a missing migration.
migration-check:
  extends: .uv
  services:
    # Same as postgres.image in the chart.
    - name: postgres:18.6-trixie@sha256:edb0c08dc33befd0262ab3b5cf1c4f3f8cfd8b09e88c05b45adee29d6761ddb6
      alias: postgres
  variables:
    POSTGRES_DB: tasks
    POSTGRES_USER: tasks
    POSTGRES_PASSWORD: ci-only
    DB_HOST: postgres
    DB_NAME: $POSTGRES_DB
    DB_USER: $POSTGRES_USER
    DB_PASSWORD: $POSTGRES_PASSWORD
  script:
    - uv run alembic upgrade head
    - uv run alembic check

# Rootless BuildKit needs no Docker daemon or privileged mode. The image leaves this job as an
# OCI image layout artifact, so scan and push work on the same bytes and nothing is rebuilt.
build-image:
  stage: build
  image:
    name: moby/buildkit:v0.35.1-rootless@sha256:7d02292556e66feea6d2d89b7ec143503b57e4f59a4efc6b7ece8547e4d3e5be
    entrypoint: [""]
  variables:
    BUILDKITD_FLAGS: --oci-worker-no-process-sandbox
  script:
    - >
      buildctl-daemonless.sh build
      --frontend dockerfile.v0
      --local context=apps/api --local dockerfile=apps/api
      --opt platform=linux/amd64
      --output type=oci,dest=image-oci,tar=false
  artifacts:
    paths: [image-oci/]
    expire_in: 1 day

trivy-scan:
  stage: scan
  image:
    name: ghcr.io/aquasecurity/trivy:0.76.2@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb
    entrypoint: [""]
  needs: [build-image]
  variables:
    TRIVY_CACHE_DIR: $CI_PROJECT_DIR/.trivy-cache
  cache:
    key: trivy-db
    paths: [.trivy-cache]
  script:
    - >
      trivy image --input image-oci
      --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed
      --exit-code 1 --no-progress
    - grep -o 'sha256:[0-9a-f]\{64\}' image-oci/index.json | head -1 | sed 's/^/Scanned /'

# Runs only after the scan passed, and pushes the scanned layout as-is, so the digest in ECR is
# the digest that was scanned. Tags are immutable, so a rerun skips a tag that already exists.
push-image:
  extends: .aws
  stage: push
  needs: [build-image, trivy-scan]
  script:
    - curl -fsSLo /tmp/crane.tgz "https://github.com/google/go-containerregistry/releases/download/${CRANE_VERSION}/go-containerregistry_Linux_x86_64.tar.gz"
    - echo "${CRANE_SHA256}  /tmp/crane.tgz" | sha256sum -c -
    - tar -xzf /tmp/crane.tgz -C /usr/local/bin crane
    - aws ecr get-login-password --region "$AWS_REGION" | crane auth login "$REGISTRY" -u AWS --password-stdin
    - digest=$(grep -o 'sha256:[0-9a-f]\{64\}' image-oci/index.json | head -1)
    - ref="${REGISTRY}/${IMAGE_REPO}:${CI_COMMIT_SHORT_SHA}"
    - |
      if existing=$(crane digest "$ref" 2>/dev/null); then
        [ "$existing" = "$digest" ] || { echo "$ref already exists with digest $existing, expected $digest" >&2; exit 1; }
        echo "$ref already pushed"
      else
        crane push image-oci "$ref"
        [ "$(crane digest "$ref")" = "$digest" ] || { echo "Pushed digest does not match the scanned image" >&2; exit 1; }
      fi
    - echo "Pushed $ref@$digest"

# Same values as make deploy. Without --create-namespace: the namespace comes from the addons stack.
deploy-dev:
  extends: .aws
  stage: deploy
  needs:
    - job: push-image
      artifacts: false
  interruptible: false
  resource_group: dev
  environment:
    name: dev
    url: https://$APP_HOST
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
  script:
    - *install-helm
    - aws eks update-kubeconfig --region "$AWS_REGION" --name "$CLUSTER_NAME"
    # --rollback-on-failure is Helm 4's name for --atomic.
    - >
      helm upgrade --install "$RELEASE" helm/task-tracker
      --namespace "$NAMESPACE"
      --set image.registry="$REGISTRY" --set image.tag="$CI_COMMIT_SHORT_SHA"
      --set externalSecrets.region="$AWS_REGION" --set ingress.host="$APP_HOST"
      --wait --rollback-on-failure --timeout 10m

smoke-test:
  stage: verify
  image: $UV_IMAGE
  needs: [deploy-dev]
  # Shared with deploy-dev, so another deploy can't start while this runs.
  resource_group: dev
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - python3 -u scripts/smoke_test.py
