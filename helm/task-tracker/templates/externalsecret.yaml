# Syncs the password from Secrets Manager into the Kubernetes Secret <release>-db (key DB_PASSWORD).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "task-tracker.dbSecretName" . }}
  labels:
    {{- include "task-tracker.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    kind: SecretStore
    name: aws-secrets-manager
  target:
    name: {{ include "task-tracker.dbSecretName" . }}
    creationPolicy: Owner       # the Secret is deleted together with this ExternalSecret
  data:
    - secretKey: DB_PASSWORD
      remoteRef:
        key: {{ .Values.externalSecrets.secretName }}
        property: password      # the secret value is JSON: {"password": "..."}
