# Headless: a stable DNS name that resolves straight to the pod IP.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "task-tracker.postgresName" . }}
  labels:
    {{- include "task-tracker.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  clusterIP: None
  selector:
    {{- include "task-tracker.selectorLabels" (dict "ctx" . "component" "postgres") | nindent 4 }}
  ports:
    - name: postgres
      port: {{ .Values.database.port }}
      targetPort: postgres
