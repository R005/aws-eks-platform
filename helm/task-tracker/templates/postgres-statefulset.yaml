# Single-replica PostgreSQL (ADR 0002). Data lives on an EBS gp3 volume from the volumeClaimTemplate;
# the PVC outlives the pod and the release, and is deleted by make undeploy.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "task-tracker.postgresName" . }}
  labels:
    {{- include "task-tracker.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  serviceName: {{ include "task-tracker.postgresName" . }}
  replicas: 1
  selector:
    matchLabels:
      {{- include "task-tracker.selectorLabels" (dict "ctx" . "component" "postgres") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "task-tracker.labels" . | nindent 8 }}
        app.kubernetes.io/component: postgres
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60   # time for a clean shutdown checkpoint
      securityContext:
        # The image's postgres user. Running as it directly skips the entrypoint's root-only chown;
        # fsGroup makes the fresh EBS volume writable for it.
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          ports:
            - name: postgres
              containerPort: {{ .Values.database.port }}
          env:
            - name: POSTGRES_DB
              value: {{ .Values.database.name | quote }}
            - name: POSTGRES_USER
              value: {{ .Values.database.user | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "task-tracker.dbSecretName" . }}
                  key: DB_PASSWORD
          readinessProbe:
            # -h 127.0.0.1: during first-run init Postgres listens on the Unix socket only,
            # so the pod stays unready until the real server accepts TCP connections.
            exec:
              command: ["sh", "-c", 'pg_isready -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB"']
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml .Values.postgres.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            # Postgres 18+ keeps data under /var/lib/postgresql/<major>/; mount the parent.
            - name: data
              mountPath: /var/lib/postgresql
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          {{- include "task-tracker.selectorLabels" (dict "ctx" . "component" "postgres") | nindent 10 }}
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: {{ .Values.postgres.storage.storageClassName }}
        resources:
          requests:
            storage: {{ .Values.postgres.storage.size }}
