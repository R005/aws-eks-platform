# No auth block: the controller uses its own IRSA role (addons stack), limited to <project>/<env>/*.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: aws-secrets-manager
  labels:
    {{- include "task-tracker.labels" . | nindent 4 }}
spec:
  provider:
    aws:
      service: SecretsManager
      region: {{ required "externalSecrets.region is required" .Values.externalSecrets.region }}
