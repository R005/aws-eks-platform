# Namespaced store for AWS Secrets Manager. No auth block: the External Secrets controller uses
# its own credentials, i.e. the IRSA role on its ServiceAccount (addons stack), which may read
# only <project>/<env>/* secrets.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: aws-secrets-manager
  labels:
    {{- include "task-tracker.labels" . | nindent 4 }}
spec:
  provider:
    aws:
      service: SecretsManager
      region: {{ required "externalSecrets.region is required" .Values.externalSecrets.region }}
