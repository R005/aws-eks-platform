# make deploy sets image.registry, image.tag, externalSecrets.region and ingress.host.

image:
  registry: ""                  # <account-id>.dkr.ecr.<region>.amazonaws.com (required)
  repository: eks-platform/api
  tag: ""                       # short Git SHA pushed by make image (required)
  pullPolicy: IfNotPresent      # tags are immutable

api:
  replicas: 2
  port: 8000
  logLevel: INFO
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 256Mi             # no CPU limit: it would throttle a replica below one core
  # Keeps serving while the ALB deregisters the pod, which is slower than the endpoint update.
  # The grace period is preStopSleepSeconds + 25.
  preStopSleepSeconds: 15

debugEndpoints:
  enabled: false                # true mounts the api's /debug/load/* stress endpoints (drills only)

database:
  name: tasks
  user: tasks
  port: 5432

postgres:
  # Same as docker-compose.yml.
  image: postgres:18.6-trixie@sha256:edb0c08dc33befd0262ab3b5cf1c4f3f8cfd8b09e88c05b45adee29d6761ddb6
  storage:
    size: 10Gi
    storageClassName: gp3
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi

ingress:
  enabled: true
  className: alb
  host: ""                      # tasks.lab.<domain>, set by make deploy (required)
  healthCheckPath: /readyz

migrate:
  backoffLimit: 2
  activeDeadlineSeconds: 300

externalSecrets:
  region: ""                    # AWS region of the secret (required)
  secretName: eks-platform/dev/db
  refreshInterval: 1h
