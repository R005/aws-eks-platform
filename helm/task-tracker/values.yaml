# Defaults for the task-tracker chart. make deploy sets image.registry, image.tag,
# externalSecrets.region and ingress.host from the environment; nothing account-specific is committed.

image:
  registry: ""                  # <account-id>.dkr.ecr.<region>.amazonaws.com (required)
  repository: eks-platform/api
  tag: ""                       # short Git SHA pushed by make image (required)
  pullPolicy: IfNotPresent      # tags are immutable, so a cached image is always correct

api:
  replicas: 2
  port: 8000
  logLevel: INFO
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 256Mi             # no CPU limit: it would throttle a replica below one core
  # Seconds the pod keeps serving before SIGTERM, while it is removed from Service endpoints and
  # deregistered from the ALB target group (which takes longer than the endpoint update).
  # The grace period is derived from it: preStopSleepSeconds + 25.
  preStopSleepSeconds: 15

database:
  name: tasks
  user: tasks
  port: 5432

postgres:
  # Same pinned image as docker-compose.yml.
  image: postgres:18.6-trixie@sha256:edb0c08dc33befd0262ab3b5cf1c4f3f8cfd8b09e88c05b45adee29d6761ddb6
  storage:
    size: 10Gi
    storageClassName: gp3
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi

ingress:
  enabled: true
  className: alb                # IngressClass created by the AWS Load Balancer Controller chart
  host: ""                      # tasks.lab.<domain>, set by make deploy (required)
  healthCheckPath: /readyz      # ALB target health check

migrate:
  backoffLimit: 2
  activeDeadlineSeconds: 300

externalSecrets:
  region: ""                    # AWS region of the secret (required)
  secretName: eks-platform/dev/db
  refreshInterval: 1h
